name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build VideoSaver
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show environment
        run: |
          xcodebuild -version
          swift --version

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project VideoSaver.xcodeproj \
            -scheme VideoSaver \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build \
            build

      - name: Package app
        run: |
          mkdir -p artifacts
          APP_PATH="build/Build/Products/Release-iphoneos/VideoSaver.app"
          test -d "$APP_PATH"
          cp -R "$APP_PATH" artifacts/VideoSaver.app
          ditto -c -k --sequesterRsrc --keepParent artifacts/VideoSaver.app artifacts/VideoSaver-iOS-unsigned.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoSaver-iOS-unsigned
          path: artifacts/VideoSaver-iOS-unsigned.zip
