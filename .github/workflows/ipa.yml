name: iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          rm -rf build

          xcodebuild \
            -project VideoSaver.xcodeproj \
            -scheme VideoSaver \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/VideoSaver.app"
          test -d "$APP_PATH"

          rm -rf build/Payload build/VideoSaver-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          cd build
          /usr/bin/zip -qry VideoSaver-unsigned.ipa Payload

          test -f VideoSaver-unsigned.ipa
          ls -lh VideoSaver-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: VideoSaver-unsigned-IPA-${{ github.run_number }}
          path: build/VideoSaver-unsigned.ipa
          if-no-files-found: error
